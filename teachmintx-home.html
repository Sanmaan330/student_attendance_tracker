<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TeachmintX-inspired classroom display home screen.">
  <title>TeachmintX Home</title>
  <link rel="stylesheet" href="css/teachmintx-home.css">
</head>
<body>
  <main class="display-frame" aria-label="TeachmintX home screen">
    <div class="status-bar">
      <span>3:46 PM</span>
      <div class="status-icons" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>

    <section class="launcher">
      <h1>Teachmint<span>X</span></h1>

      <div class="clock" aria-label="Current time">
        <span class="clock-date">Wed, Oct 22</span>
        <strong>3:46</strong>
      </div>

      <div class="search-bar" role="search">
        <span class="google-mark" aria-hidden="true">G</span>
        <span class="search-placeholder">Search</span>
        <div class="search-tools" aria-hidden="true"><span class="mic-icon"></span><span class="lens-icon"></span></div>
      </div>

      <nav class="app-grid" aria-label="Applications">
        <a class="app-link" href="#teachmint">
          <span class="app-icon teachmint-icon"><span>✦</span></span>
          <span>Teachmint</span>
        </a>
        <a class="app-link" href="#screenshare">
          <span class="app-icon screen-icon"><span></span></span>
          <span>Screen Share</span>
        </a>
        <a class="app-link" href="#google">
          <span class="app-icon google-icon"><b>G</b></span>
          <span>Google</span>
        </a>
        <a class="app-link" href="#meet">
          <span class="app-icon meet-icon"><span></span></span>
          <span>Meet</span>
        </a>
        <a class="app-link" href="#playstore">
          <span class="app-icon play-icon"><span></span></span>
          <span>Play Store</span>
        </a>
      </nav>
    </section>

    <div class="floor" aria-hidden="true"><div class="wave wave-one"></div><div class="wave wave-two"></div></div>

    <nav class="system-nav" aria-label="System navigation">
      <a href="#back" aria-label="Back"><span class="back-arrow"></span></a>
      <a href="#home" aria-label="Home"><span class="home-circle"></span></a>
      <a href="#recent" aria-label="Recent apps"><span class="recent-square"></span></a>
    </nav>
  </main>
</body>
</html>
